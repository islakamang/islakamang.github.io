<style>
:root{
  --ink:#1b1f4b; --ink2:#444a86; --paper:#ffffff; --gold:#ffc93c; --orange:#ff8a3d; --pink:#ff5c8a; --violet:#7c5cff;
  --teal:#19c3d9; --green:#2fbf5b; --sky:#7be0ff; --zone:#ff8a3d; --zone2:#ffd86b; --radius:26px;
  --font:"Baloo 2","Nunito","Segoe UI Rounded","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--font),var(--emoji);color:var(--ink);background:#bdeeff;overflow-x:hidden;font-size:18px;line-height:1.35}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #fff;box-shadow:0 0 0 7px var(--violet)}
.emo{font-family:var(--emoji)}

/* ---------- frame ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#bg{position:absolute;inset:0;transition:background .8s ease;background:linear-gradient(180deg,#7be0ff,#d5f6ff 55%,#fff6c9)}
#floaties{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#floaties span{position:absolute;bottom:-60px;font-size:30px;opacity:.55;animation:floatUp linear infinite;font-family:var(--emoji)}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.6}90%{opacity:.5}100%{transform:translateY(-115vh) rotate(40deg);opacity:0}}
#hud{position:relative;z-index:5;display:none;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:max(10px,env(safe-area-inset-top)) 14px 8px}
#hud.on{display:flex}
#hudzone{margin-right:auto;min-width:0;flex:0 1 auto}
#hudzone span:last-child{overflow:hidden;text-overflow:ellipsis}
.tog{flex:none}
@media(min-width:760px){#bar{order:0;flex:1 1 auto;height:22px}#hudzone{margin-right:0}}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:0 4px 0 rgba(27,31,75,.12);white-space:nowrap}
.chip .emo{font-size:22px}
#bar{order:5;flex:1 1 100%;height:16px;background:rgba(255,255,255,.65);border-radius:999px;overflow:hidden;box-shadow:inset 0 3px 6px rgba(27,31,75,.18)}
#bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(180deg,#fff7,#0000 55%),var(--zone);transition:width .6s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 0 14px var(--zone)}
.tog{white-space:nowrap;background:rgba(255,255,255,.92);border-radius:999px;min-width:46px;height:46px;padding:0 12px;font-weight:800;box-shadow:0 4px 0 rgba(27,31,75,.12);font-size:16px}
.tog:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(27,31,75,.12)}
#toplang{position:absolute;z-index:6;top:calc(max(10px,env(safe-area-inset-top)) + var(--pbar,0px));right:14px;display:flex;gap:8px}
#hud.on ~ #toplang{position:static;display:none}
#screen{position:relative;z-index:2;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scr.still{animation:none}
.scr{min-height:100%;display:flex;flex-direction:column;align-items:center;animation:scrIn .5s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes scrIn{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
.wrap{width:100%;max-width:860px;padding:8px 16px 28px;margin:0 auto}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:12px 30px;border-radius:999px;font-weight:800;font-size:22px;color:#fff;
  background:linear-gradient(180deg,#ffffff55,#0000 50%),var(--orange);box-shadow:0 7px 0 #b84d0e,0 14px 24px rgba(27,31,75,.25);transition:transform .12s,box-shadow .12s;letter-spacing:.3px}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(6px);box-shadow:0 1px 0 #b84d0e,0 4px 8px rgba(27,31,75,.25)}
.btn.green{background:linear-gradient(180deg,#ffffff55,#0000 50%),var(--green);box-shadow:0 7px 0 #17803a,0 14px 24px rgba(27,31,75,.25)}
.btn.violet{background:linear-gradient(180deg,#ffffff55,#0000 50%),var(--violet);box-shadow:0 7px 0 #4a31c4,0 14px 24px rgba(27,31,75,.25)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 rgba(27,31,75,.18)}
.btn.small{min-height:52px;font-size:18px;padding:8px 22px}
.btn[disabled]{filter:grayscale(.8) opacity(.55);pointer-events:none}
@keyframes nudge{0%{transform:scale(1)}30%{transform:scale(1.14) translateY(-4px)}55%{transform:scale(.96)}75%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes readyGlow{0%,100%{box-shadow:0 6px 0 rgba(0,0,0,.25),0 0 0 0 rgba(255,255,255,.0)}50%{box-shadow:0 6px 0 rgba(0,0,0,.25),0 0 0 7px rgba(255,255,255,.55)}}
.btn.ready{animation:readyGlow 1.8s ease-in-out infinite}
.btn.ready.nudge{animation:nudge .65s cubic-bezier(.3,1.5,.5,1) 1,readyGlow 1.8s ease-in-out .65s infinite}
.nhint{flex:1;text-align:center;font-weight:800;font-size:13px;color:#1b1f4bb0;line-height:1.15;padding:0 6px}
@media (prefers-reduced-motion:reduce){.btn.ready,.btn.ready.nudge{animation:none}}
.btn.pulse{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* ---------- nexy ---------- */
.nx{will-change:transform;width:120px;height:auto;display:block;overflow:visible;filter:drop-shadow(0 10px 8px rgba(27,31,75,.22))}
.nx .bob{animation:bob 2.4s ease-in-out infinite;transform-origin:100px 230px}
@keyframes bob{50%{transform:translateY(-7px) rotate(-1.5deg)}}
.nx .eyes{animation:blink 4.2s infinite;transform-origin:100px 96px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.nx .armL,.nx .armR{transition:transform .35s;transform-origin:50% 40%}
.nx.cheer .armL{transform:rotate(150deg) translate(-4px,6px)}
.nx.cheer .armR{transform:rotate(-150deg) translate(4px,6px)}
.nx.wave .armR{animation:wave .7s ease-in-out infinite alternate;transform-origin:154px 150px}
@keyframes wave{from{transform:rotate(-20deg)}to{transform:rotate(-70deg)}}
.nexyrow{display:flex;align-items:flex-end;gap:6px;width:100%}
.bubble{position:relative;background:#fff;border-radius:26px;padding:14px 20px;font-weight:700;font-size:20px;box-shadow:0 6px 0 rgba(27,31,75,.12),0 14px 26px rgba(27,31,75,.14);flex:1;margin-bottom:34px}
.bubble:before{content:"";position:absolute;left:-14px;bottom:20px;border:12px solid transparent;border-right-color:#fff;border-left:0}
.bubble b{color:var(--zone)}

/* ---------- splash ---------- */
.splash{position:relative;width:100%;height:100vh;height:100dvh;min-height:560px;overflow:hidden}
.splash svg.scene{position:absolute;inset:0;width:100%;height:100%}
.splash .layer{transition:transform .2s ease-out}
.splash .top{position:absolute;left:0;right:0;top:7%;text-align:center;padding:0 16px}
.logo{font-weight:800;font-size:clamp(46px,9vw,104px);line-height:.95;letter-spacing:1px;color:#fff;text-shadow:0 5px 0 #ff8a3d,0 10px 0 #b84d0e,0 20px 30px rgba(27,31,75,.35);-webkit-text-stroke:3px #ff6a00;paint-order:stroke fill}
.logo small{display:block;font-size:.34em;letter-spacing:6px;color:#fff;-webkit-text-stroke:0;text-shadow:0 3px 0 #1b1f4b66;margin-bottom:6px}
.tag{margin:14px auto 0;font-size:clamp(20px,3.4vw,30px);font-weight:800;color:var(--ink);background:#ffffffd9;border-radius:999px;display:inline-block;padding:6px 22px;box-shadow:0 5px 0 rgba(27,31,75,.12)}
.splash .cta{position:absolute;left:0;right:0;bottom:7%;text-align:center}
.splash .meta{margin-top:16px;font-weight:700;font-size:16px;color:var(--ink);background:#ffffffcc;display:inline-block;padding:4px 16px;border-radius:999px}
.splash .nexyspot{position:absolute;left:7%;bottom:13%;width:clamp(120px,19vw,210px);z-index:3}
.splash .nexyspot .nx{width:100%}
.splash .hello{position:absolute;left:calc(7% + clamp(100px,16vw,180px));bottom:calc(13% + clamp(120px,18vw,210px));max-width:260px;background:#fff;border-radius:22px;padding:10px 16px;font-weight:800;box-shadow:0 6px 0 rgba(27,31,75,.12);animation:bob 3s ease-in-out infinite}
@media(max-width:640px){.splash .top{top:13%}.splash .cta{bottom:4%}.splash .nexyspot{left:2%;bottom:24%;width:112px}.splash .hello{left:calc(2% + 100px);bottom:calc(24% + 70px);max-width:200px;font-size:15px;padding:8px 12px}.splash .hello:after{content:"";position:absolute;left:-10px;bottom:14px;border:9px solid transparent;border-right-color:#fff;border-left:0}.splash .meta{font-size:14px}}
@media(max-height:620px){.splash .hello{display:none}}

/* ---------- cards ---------- */
.panel{background:#fff;border-radius:var(--radius);padding:22px;box-shadow:0 8px 0 rgba(27,31,75,.1),0 18px 34px rgba(27,31,75,.16)}
.panel h2{margin:0 0 8px;font-size:28px;line-height:1.1;color:var(--zone)}
.panel p{margin:10px 0;font-weight:600;font-size:19px;line-height:1.4}
.big{font-size:clamp(24px,4.4vw,34px);line-height:1.15;font-weight:800;text-align:center;margin:8px 0 18px}
.sub{font-size:16px;font-weight:700;color:var(--ink2);text-align:center;margin:0 0 6px}
.zonehead{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 4px}
.zonechip{background:var(--zone);color:#fff;border-radius:999px;padding:3px 16px;font-weight:800;font-size:15px;letter-spacing:1px;text-transform:uppercase;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.opts{display:grid;gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
@media(max-width:560px){.opts.two{grid-template-columns:1fr}}
.opt{position:relative;display:flex;align-items:center;gap:14px;text-align:left;min-height:68px;padding:12px 18px;background:#f0f4ff;border-radius:22px;font-weight:800;font-size:20px;line-height:1.2;
  box-shadow:0 6px 0 rgba(27,31,75,.16),0 0 0 3px #fff inset;border:3px solid #fff;transition:transform .12s,box-shadow .12s,background .2s}
.opt:hover{transform:translateY(-3px);box-shadow:0 9px 0 rgba(27,31,75,.16)}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(27,31,75,.16)}
.opt .bd{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--zone2);color:var(--ink);font-size:20px;font-weight:800}
.opt .tk{margin-left:auto;font-size:26px;opacity:0;transform:scale(.3);transition:.2s}
.opt.sel{background:linear-gradient(180deg,#ffffff50,#0000 55%),var(--zone);color:#fff;border-color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.28),0 0 0 4px var(--zone);animation:selpop .35s}
.opt.sel .bd{background:#fff;color:var(--zone)}
.opt.sel .tk{opacity:1;transform:none}
@keyframes selpop{40%{transform:scale(1.04)}}
.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.dots i{width:12px;height:12px;border-radius:50%;background:#fff9;box-shadow:inset 0 2px 3px rgba(27,31,75,.25)}
.dots i.on{background:var(--zone)}
.dots i.cur{background:#fff;box-shadow:0 0 0 4px var(--zone)}
.navbar .btn{white-space:nowrap;padding:10px 24px;font-size:20px;min-height:58px}
.navbar .btn.small{font-size:17px;padding:8px 18px;min-height:52px}
#hud:not(.on) ~ #screen .wrap{padding-top:70px}
.navbar{position:sticky;bottom:0;z-index:4;display:flex;justify-content:space-between;gap:10px;padding:12px 16px max(14px,env(safe-area-inset-bottom));max-width:860px;width:100%;margin:0 auto;background:linear-gradient(180deg,#fff0,#ffffffb0 40%)}
.stack{display:grid;gap:10px}
.lbl{font-weight:800;font-size:17px;margin:10px 0 6px;color:var(--ink2)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scale .opt{flex-direction:column;justify-content:center;text-align:center;padding:10px 6px;min-height:84px;font-size:16px;gap:6px}
.scale .opt .bd{width:38px;height:38px;border-radius:50%}
@media(max-width:560px){.scale{gap:5px}.scale .opt{padding:8px 2px;min-height:76px;font-size:12.5px;gap:4px;border-radius:16px;letter-spacing:-.2px}.scale .opt .bd{width:30px;height:30px;font-size:16px;border-radius:50%}}
.pill3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.pill3{grid-template-columns:1fr}}
.pill3 .opt{justify-content:center;text-align:center;min-height:82px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:720px){.tri{grid-template-columns:1fr}}
.tri .opt{flex-direction:column;align-items:stretch;text-align:center;padding:16px 14px 18px;gap:8px;font-size:19px}
@media(max-width:720px){.tri .opt{flex-direction:row;align-items:center;text-align:left}}
.tri .em{font-size:56px;line-height:1.05;filter:drop-shadow(0 6px 4px rgba(27,31,75,.2))}
@media(max-width:720px){.tri .em{font-size:44px}}
.tri .timg{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;display:block;background:#e9ecf5;box-shadow:0 4px 10px rgba(27,31,75,.18)}
@media(max-width:720px){.tri .opt.hasimg{flex-direction:column;align-items:stretch;text-align:left;gap:10px}.tri .timg{width:100%;aspect-ratio:16/9}}
.tri .tagc{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--zone);font-weight:800}
.tri .opt.sel .tagc{color:#fff}
.allfine{margin-top:12px}
textarea,input[type=text],input[type=date]{width:100%;font:inherit;font-weight:700;font-size:20px;padding:14px 16px;border-radius:18px;border:3px solid #dbe3ff;background:#f5f8ff;color:var(--ink)}
textarea{min-height:150px;resize:vertical}
.count{text-align:right;font-weight:700;color:var(--ink2);font-size:14px}
.check{display:flex;gap:14px;align-items:flex-start;background:#fff8dd;border-radius:20px;padding:14px;font-weight:800;font-size:19px;cursor:pointer;border:3px solid #ffe08a}
.check input{width:34px;height:34px;flex:none;accent-color:var(--green)}
.field{margin:10px 0}
.field label{display:block;font-weight:800;font-size:16px;margin:0 0 4px;color:var(--ink2)}
.ribbon{display:inline-block;background:#ff5c8a;color:#fff;font-weight:800;font-size:13px;padding:2px 12px;border-radius:999px;margin-bottom:8px}
.agegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.agegrid .opt{justify-content:center;font-size:clamp(20px,5vw,26px);min-height:60px;padding:6px}
.agegrid .opt.wide{grid-column:span 5;font-size:16px;min-height:52px;text-align:center}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0}
.avgrid .opt{justify-content:center;font-size:54px;min-height:100px;padding:6px;border-radius:28px}
.toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-30px);background:#fff;border-radius:999px;padding:8px 22px;font-weight:800;box-shadow:0 8px 0 rgba(27,31,75,.12);opacity:0;transition:.35s;z-index:9;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;z-index:20;pointer-events:none}

/* ---------- map ---------- */
.mapbox{position:relative;width:100%;aspect-ratio:16/10;border-radius:34px;overflow:hidden;box-shadow:0 10px 0 rgba(27,31,75,.14),0 24px 40px rgba(27,31,75,.22);background:#3ec9ff}
@media(max-width:560px){.mapbox{aspect-ratio:4/5}}
.mapbox svg.mapart{position:absolute;inset:0;width:100%;height:100%}
.mapbox svg.route{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;z-index:3;width:max-content;max-width:120px;text-align:center}
.node i{display:grid;place-items:center;width:clamp(46px,7.5vw,72px);height:clamp(46px,7.5vw,72px);border-radius:50%;font-style:normal;font-size:clamp(24px,4vw,38px);background:#fff;border:5px solid var(--c);box-shadow:0 6px 0 rgba(27,31,75,.25),0 0 0 4px #fff8}
.node b{font-size:clamp(11px,1.6vw,15px);background:#fff;border-radius:10px;padding:1px 8px;line-height:1.15;box-shadow:0 3px 0 rgba(27,31,75,.15)}
.node.lock i{filter:grayscale(1);opacity:.78;background:#e6ebf5;border-color:#aeb8d4}
.node.lock b{opacity:.8}
.node.done i{background:var(--c);color:#fff}
.node.done:after{content:"⭐";position:absolute;top:-8px;right:4px;font-size:24px;animation:selpop 1s infinite}
.node.cur i{animation:nodepulse 1.2s ease-in-out infinite}
@keyframes nodepulse{0%,100%{box-shadow:0 6px 0 rgba(27,31,75,.25),0 0 0 4px #fff8,0 0 0 4px var(--c)}50%{box-shadow:0 6px 0 rgba(27,31,75,.25),0 0 0 4px #fff8,0 0 0 20px #fff0}}
.you{position:absolute;z-index:4;transform:translate(-50%,-135%);font-size:clamp(28px,5vw,46px);transition:left 1.2s cubic-bezier(.5,0,.2,1),top 1.2s cubic-bezier(.5,0,.2,1);filter:drop-shadow(0 6px 4px rgba(0,0,0,.3));animation:hop 1s ease-in-out infinite}
@keyframes hop{50%{margin-top:-8px}}
.badgebig{font-size:110px;line-height:1;filter:drop-shadow(0 12px 8px rgba(27,31,75,.3));animation:badge 1.4s cubic-bezier(.2,1.4,.4,1) both}
@keyframes badge{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.badges span{background:var(--c);color:#fff;border-radius:999px;padding:4px 14px;font-weight:800;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.2)}

/* ---------- finale ---------- */
.fin{width:100%;max-width:1000px;margin:0 auto;padding:6px 14px 120px}
.purse{display:flex;align-items:center;gap:14px;background:#fff;border-radius:26px;padding:10px 16px;box-shadow:0 7px 0 rgba(27,31,75,.12);flex-wrap:wrap}
.purse .num{font-size:44px;font-weight:800;line-height:1;color:#e39500;min-width:62px;text-align:center}
.purse .txt{font-weight:800;line-height:1.05}
.coinrow{flex:1;display:flex;flex-wrap:wrap;gap:4px;min-width:220px}
.coinrow i{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b0,#ffc93c 55%,#e39500);box-shadow:0 2px 0 #b66f00;transition:.3s}
.coinrow i.gone{opacity:.15;transform:scale(.5);filter:grayscale(1)}
.lot{position:relative;margin:14px 0;border-radius:30px;min-height:230px;padding:14px;overflow:hidden;
  background:linear-gradient(180deg,#bfefff 0%,#e9fbff 28%,#8fe08a 28%,#53c85f 100%);box-shadow:0 8px 0 rgba(27,31,75,.14),0 20px 30px rgba(27,31,75,.18)}
.lot:before{content:"";position:absolute;left:0;right:0;top:22%;height:10%;background:linear-gradient(180deg,#a3b8ff,#8aa0f5);clip-path:polygon(0 100%,8% 30%,16% 70%,28% 10%,40% 60%,52% 20%,66% 70%,78% 25%,90% 65%,100% 35%,100% 100%)}
.lot:after{content:"";position:absolute;right:-30px;top:30%;bottom:-10px;width:70px;background:linear-gradient(90deg,#3ec9ff,#19c3d9);transform:skewX(-12deg);opacity:.9}

const DATA = {"title": ["KAMANG TEEN SURVEY", "KAMANG TEEN SURVEY"], "subtitle": ["Ilagan City Teen Center", "Ilagan City Teen Center"], "info": {"head": ["ABOUT THIS SURVEY", "TUNGKOL SA SURVEY NA ITO"], "paras": [["This is the KAMANG Teen Survey, part of a thesis by John Patrick R. Castillo, a BS Architecture student at the University of Saint Louis, Tuguegarao. A teen center is being designed for Ilagan City, and this survey asks teens aged 10 to 19, especially those who live in Ilagan, what they need from it and what they want it to be like. It takes about 8 to 11 minutes.", "Ito ang KAMANG Teen Survey, bahagi ng thesis ni John Patrick R. Castillo, mag-aaral ng BS Architecture sa University of Saint Louis, Tuguegarao. Idinidisenyo ang isang teen center para sa Lungsod ng Ilagan, at itinatanong ng survey na ito sa mga teen na 10 hanggang 19 taong gulang, lalo na sa mga nakatira sa Ilagan, kung ano ang kailangan nila rito at kung ano ang gusto nilang maging ito. Aabutin ito nang mga 8 hanggang 11 minuto."], ["There are no right or wrong answers, no grades, and no names. Answer each question to move on. You can stop at any time. If you stop before the end, nothing you answered is saved. Your answers are anonymous, protected by the Data Privacy Act (RA 10173), and reported only as group totals. At the end you get 40 coins to build your own teen center. The coins are only a game. They are not money, and there is no prize.", "Walang tama o maling sagot, walang grado, at walang pangalan. Sagutin ang bawat tanong para magpatuloy. Maaari kang huminto anumang oras. Kapag huminto ka bago matapos, walang masasave sa mga sagot mo. Anonymous ang mga sagot mo, protektado ng Data Privacy Act (RA 10173), at iuulat lamang bilang kabuuan ng grupo. Sa dulo, may 40 barya ka para buuin ang sarili mong teen center. Laro lang ang mga barya. Hindi ito pera, at walang premyo."]]}, "minutes": ["20 to 25", "20 hanggang 25"], "gate": {"age": {"q": ["How old are you?", "Ilang taon ka na?"], ta ng Sheet. Group totals lang ang ipapakita, hindi isa-isa (Data Privacy Act, RA 10173)."], ["Answers are counted and compared by age group, sex, and where you live with statistics, to see which places teens need most and which needs have no good place yet.", "Bibilangin at ihahambing ang mga sagot ayon sa edad, kasarian, at tirahan gamit ang estadistika, para makita kung anong mga lugar ang pinakakailangan ng mga teen at aling pangangailangan ang wala pang magandang lugar."], ["The results become tables and charts that guide how KAMANG, the Ilagan City Teen Center, is designed.", "Ang mga resulta ay magiging mga talahanayan at tsart na gagabay sa disenyo ng KAMANG, ang Ilagan City Teen Center."]]}, "parentLite": {"head": ["PARENT OR GUARDIAN OK", "OK NG MAGULANG O TAGAPAG-ALAGA"], "para": ["This survey needs the OK of your parent or guardian. It is anonymous, it asks about places and activities (nothing painful or personal), and you can stop any time.", "Kailangan ng survey na ito ang OK ng magulang o tagapag-alaga mo. Anonymous ito, tungkol sa mga lugar at gawain ang mga tanong (walang masakit o personal), at maaari kang huminto anumang oras."], "check": ["My parent or guardian has already said yes to this survey.", "Pumayag na ang magulang o tagapag-alaga ko sa survey na ito."], "field": ["Name of the parent or guardian who said yes", "Pangalan ng magulang o tagapag-alaga na pumayag"]}, "needBranch": {"rows": ["N1.1", "N1.2", "N1.3", "N1.4", "N1.5", "N1.6", "N1.9", "N1.10"], "cap": 3, "min": 3}, "needRows": [{"id": "N1.1", "q": ["Hang out and eat with friends", "Tumambay at kumain kasama ang mga kaibigan"]}, {"id": "N1.2", "q": ["Study or do schoolwork and group projects", "Mag-aral o gumawa ng schoolwork at group project"]}, {"id": "N1.3", "q": ["Play sports or exercise", "Maglaro ng sports o mag-ehersisyo"]}, {"id": "N1.4", "q": ["Dance, sing, play music, draw, or make things", "Sumayaw, kumanta, tumugtog, gumuhit, o lumikha"]}, {"id": "N1.5", "q": ["Use a com function impulse(sec,decay){ const r=AC.sampleRate, n=Math.floor(r*sec), b=AC.createBuffer(2,n,r); for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay); } return b; }

    const lim=AC.createDynamicsCompressor(); lim.threshold.value=-14; lim.knee.value=8; lim.ratio.value=12; lim.attack.value=.002; lim.release.value=.18; lim.connect(AC.destination);   // loud, but it cannot distort
    busMain=AC.createGain(); busMain.gain.value=1.9; busMain.connect(lim);
    busMusic=AC.createGain(); busMusic.gain.value=0; busMusic.connect(busMain);
    busSfx=AC.createGain(); busSfx.gain.value=2.6; busSfx.connect(busMain);
    const verb=AC.createConvolver(); verb.buffer=impulse(1.1,2.6); const vg=AC.createGain(); vg.gain.value=.3; verb.connect(vg); vg.connect(busMain);   // a little room echo on the effects

function tone(f,t,d,type,v,dest,slideTo,det){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'triangle'; o.frequency.setValueAtTime(f,t);

function noise(t,d,v,f0,f1,dest){ if(!NB){ NB=AC.createBuffer(1,Math.floor(AC.sampleRate*.5),AC.sampleRate); const a=NB.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=Math.random()*2-1; }

function device(){ const w=innerWidth; return (matchMedia('(pointer:coarse)').matches?'touch':'pointer')+'-'+(w<600?'phone':w<1000?'tablet':'desktop'); }
function buildPayload(){
  const ans={}; Object.entries(st.answers).forEach(([k,v])=>{ if(k.startsWith('__')) return; if(typeof v==='string'){ v=v.trim(); if(!v) return; } ans[k]=v; });
  DATA.parts.forEach(p=>p.cards.forEach(c=>{
    if(c.when && !evalWhen(c.when)){ delete ans[c.id]; delete ans[c.id+'.other']; return; }       // follow-up no longer applies
    if(c.dyn){ const strong=new Set(strongRows().map(x=>x.i)); let a=(Array.isArray(ans[c.id])?ans[c.id]:[]).filter(i=>strong.has(i));
      if(c.id==='NPp') a=a.filter(i=>!(Array.isArray(ans.NPg)&&ans.NPg.includes(i)));
      if(a.length) ans[c.id]=a; else delete ans[c.id]; }
    if(c.otherIdx!==undefined){ const a=ans[c.id], on=Array.isArray(a)?a.includes(c.otherIdx):a===c.otherIdx; if(!on) delete ans[c.id+'.other']; }
  }));
  if(Number.isInteger(st.ageNum) && st.ageNum>=10 && st.ageNum<=19) ans.A0 = st.ageNum-10;       // age in years, asked on the first screen
  const game = st.finSkipped ? null : DATA.finale.tiers.flatMap(t=>t.items.filter(i=>st.fin[i.id]).map(i=>i.id));
  return { type:'response', v:1, lang:['en','fil'][st.lang], ageBand:st.ageBand, device:device(), started:new Date(st.started).toISOString(), ended:new Date().toISOString(),
           totalSecs:Math.round((Date.now()-st.started)/1000), stageSecs:st.stageSecs, answers:ans, game, gameSkipped:st.finSkipped };
}

async function submitAll(){
  const msg=$('#sendmsg'), btns=$('#sendbtns');
  if(st.sent){ msg.textContent=raw(UI.sent); return; }
  if(st.sending) return;
  const payload=st.lastPayload||buildPayload(); st.lastPayload=payload;
  if(!CFG.endpoint){ msg.textContent=raw(UI.preview); btns.innerHTML=(PROTO?'':`<button class="btn small violet" data-act="download">${U('download')}</button> `)+`<button class="btn small ghost" data-act="replay">${U('replay')}</button>`; return; }
  msg.textContent=raw(UI.sending); st.sending=true;

  catch(e){ const m2=$('#sendmsg'); if(m2) m2.textContent=raw(UI.retry); const b2=$('#sendbtns'); if(b2) b2.innerHTML=`<button class="btn small" data-act="retry">${U('tryagain')}</button>`; }
  finally{ st.sending=false; }
}

    if(c.kind==='multi'){ const cur=Array.isArray(st.answers[c.id])?[...st.answers[c.id]]:[]; const k=cur.indexOf(i); if(k>=0) cur.splice(k,1); else if(!c.max||cur.length<c.max) cur.push(i); else { toast(`${raw(UI.chooseUpTo)} ${c.max}`); return; } st.answers[c.id]=cur; save(); viewCard(S_()); if(c.otherIdx!==undefined && i===c.otherIdx && cur.includes(i)){ const f=$('#oinp'); if(f) f.focus(); } return; }
    st.answers[c.id]=i; save(); b.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); document.querySelectorAll('.allfine').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); setNext(c); if(c.otherIdx!==undefined && i===c.otherIdx){ viewCard(S_()); const f=$('#oinp'); if(f) f.focus(); } }
  else if(a==='pickNeed'){ const c=card(), cur=Object.assign({},st.answers[c.id]||{}); cur[b.dataset.k]=+b.dataset.i; st.answers[c.id]=cur; (b.dataset.k==='s' ? sfx.rate(+b.dataset.i) : sfx.place()); save(); viewCard(S_()); }
  else if(a==='next'){ const s=S_(); if(s && s.t==='card' && !cardReady(card())){ sfx.buzz(); toast(raw(UI.answerFirstToast)); return; } sfx.next(); advance(); }
  else if(a==='back'){ sfx.back(); const s=S_(); if(s.t==='card'&&card().kind==='need'&&st.needPage){ st.needPage=0; viewCard(s); } else if(s.t==='card'||s.t==='wish'){ go(prevIdx(st.i)); } }
  else if(a==='tab'){ const k=+b.dataset.k; finTab = finTab===k ? -1 : k; sfx.tap(); finRender(); const g=$('.grpbox'); if(g && g.getBoundingClientRect().top<0) g.scrollIntoView({behavior:'smooth',block:'start'}); }
  else if(a==='buy'){ const id=b.dataset.id, t=DATA.finale.tiers.find(t=>t.items.some(i=>i.id===id)); if(st.fin[id]){ delete st.fin[id]; sfx.uncoin(); } else if(coinsLeft()>=t.cost){ st.fin[id]=1; sfx.coin(); } else { sfx.buzz(); toast(raw(UI.noCoins)); return; } save(); finRender(); if(coinsLeft()===0){ sfx.win(); confetti(60,innerWidth/2,innerHeight-120); toast('🪙 0 — '+raw(UI.build)); } }
  else if(a==='wishGo'){ (S_().k===1 ? sfx.sparkle() : sfx.next()); advance(); }
  else if(a==='finDone'){ st.finSkipped=false; advance(); const r=RANKS()[DATA.parts.length+1]; setTimeout(()=>{ sfx.win(); confetti(120); toast(`⬆️ ${raw(UI.levelUp)} ${raw(UI.level)} ${r.n} · ${raw(r.name)}`); },250); }
  else if(a==='finSkip'){ st.fin={}; st.finSkipped=true; advance(); }
  else if(a==='retry') submitAll();
  else if(a==='download'){ const blob=new Blob([JSON.stringify(st.lastPayload,null,1)],{type:'application/json'}); const u=URL.createObjectURL(blob), l=document.createElement('a'); l.href=u; l.download='kamang-preview-answers.json'; l.click(); }
  else if(a==='replay'){ wipe(); location.reload(); }
});
function toggleLang(){ sfx.lang(); if(PROTO) setTimeout(protoSetup,0); if(st.phase==='pre'&&st.pre==='consent'){ window.__cd=($('#cf0')||{}).value||''; window.__cc=($('#cchk')||{}).checked; } if(st.phase==='pre'&&st.pre==='assent'){ window.__ac=($('#achk')||{}).checked; }
  st.lang=1-st.lang; document.documentElement.lang=['en','fil'][st.lang]; try{localStorage.setItem('kamang_lang',st.lang)}catch(e){} const p=document.activeElement; render(); }
function toggleSnd(){ st.snd = st.snd>=2 ? 0 : 2; if(st.snd>=2) unlockAudio(); applySound(); sfx.pick(); hud(); }
['#hlang','#tlang'].forEach(s=>$(s).addEventListener('click',toggleLang));
['#hsnd','#tsnd'].forEach(s=>$(s).addEventListener('click',toggleSnd));
$('#coach').addEventListener('click',e=>{ if(e.target.id==='coach') closeTip(); });
addEventListener('keydown',e=>{ if(e.key==='Escape') closeTip(); });
addEventListener('resize',()=>{ if($('#coach').classList.contains('on')) langTip(); });

/* ======================= start ======================= */
try{ const l=localStorage.getItem('kamang_lang'); if(l!==null) st.lang=+l; else if((navigator.language||'').toLowerCase().startsWith('fil')||(navigator.language||'').toLowerCase().startsWith('tl')) st.lang=1; }catch(e){}
document.documentElement.lang=['en','fil'][st.lang];
protoSetup();
if(load()){ render(); } else { render(); }
if(st.snd>=2){ try{ ac(); musicStart(); }catch(e){} }   // browsers may hold the sound until the first touch; unlockAudio() then lets it play
window.__kamang = { st, STEPS, DATA, buildPayload, go, render, coinsLeft, nextIdx, prevIdx, active, topNeeds, progress, sndState:()=>({ctx:AC&&AC.state,music:M.on,snd:st.snd,shift:M.shift,step:M.step}), sfx };
})();
</script>
