<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KAMANG Design Studio</title>
<style>:root{--ink:#1f2430;--mut:#5a6372;--rule:#d5dae3;--bg:#f5f7fb;--card:#fff;--blue:#2b5c9e;--blue-t:#e6eef8;--purple:#6a4c93;--purple-t:#eee8f5;--orange:#b9631a;--orange-t:#fbeedc;--gold:#8a6a10;--gold-t:#fbf3da;--slate:#3e5c76;--slate-t:#eaeff4;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Calibri,Arial,sans-serif}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:14px;padding:8px 18px}
header.top h1{font-size:17px;margin:0;color:var(--blue);white-space:nowrap}
header.top h1 small{color:var(--mut);font-weight:400;font-size:12px;margin-left:8px}
nav.steps{display:flex;gap:4px;flex:1;overflow-x:auto}
nav.steps button{border:1px solid var(--rule);background:#fff;border-radius:18px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);white-space:nowrap}
nav.steps button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
nav.steps button.done::after{content:" \2713";color:var(--slate)}
nav.steps button.on.done::after{color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;padding:16px 18px;max-width:1500px;margin:0 auto}
@media(max-width:1000px){.layout{grid-template-columns:1fr}}
main#main{min-width:0}
aside#coach{position:sticky;top:62px;align-self:start;max-height:calc(100vh - 78px);overflow:auto;background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:12px}
h2{margin:0 0 6px;font-size:21px}h3{margin:16px 0 6px;font-size:16px}h4{margin:10px 0 4px;font-size:14px}
p{margin:6px 0}.mut{color:var(--mut)}.small{font-size:12.5px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.card.proposal{border-left:4px solid var(--purple);background:#fcfaff}
.card.evidence{border-left:4px solid var(--blue)}
.card.mine{border-left:4px solid var(--orange)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr}}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--rule);background:#fff;color:var(--ink);padding:5px 11px;border-radius:7px;cursor:pointer}
button:hover{background:var(--slate-t)}button.pri{background:var(--blue);border-color:var(--blue);color:#fff}button.pri:hover{background:#244e86}
button.sel{background:var(--slate);color:#fff;border-color:var(--slate)}
button.adopt.sel{background:var(--blue);border-color:var(--blue)}button.adapt.sel{background:var(--purple);border-color:var(--purple)}button.aside.sel{background:var(--orange);border-color:var(--orange)}button.defer.sel{background:var(--gold);border-color:var(--gold)}
button.tiny{padding:2px 8px;font-size:12px}button.link{border:none;background:none;color:var(--blue);padding:0;text-decoration:underline}
input[type=text],input[type=number],select,textarea{font:inherit;font-size:14px;border:1px solid var(--rule);border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:60px;resize:vertical}
label.f{display:block;font-size:12.5px;color:var(--mut);margin-bottom:3px}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:10px;border:1px solid var(--rule);background:var(--slate-t);color:var(--slate);margin:1px 3px 1px 0;white-space:nowrap}
.tag.Survey{background:var(--purple-t);color:var(--purple);border-color:#cdbfe0}.tag.Site{background:var(--orange-t);color:var(--orange);border-color:#ecd0b0}.tag.Law{background:var(--gold-t);color:var(--gold);border-color:#e5d49a}
.tag.Theory{background:var(--blue-t);color:var(--blue);border-color:#bfd2ea}.tag.Precedent{background:var(--slate-t)}.tag.Youth{background:var(--blue-t);color:var(--blue)}
.tag.draft{background:#f1eaf8;color:var(--purple);border-color:#cdbfe0}.tag.final{background:var(--blue-t);color:var(--blue)}
.chip{display:inline-block;border:1px solid var(--rule);background:#fff;border-radius:16px;padding:3px 11px;margin:2px 4px 2px 0;font-size:13px;cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}.chip:hover{background:var(--slate-t)}.chip.on:hover{background:#244e86}
.sev{display:inline-block;min-width:22px;text-align:center;font-weight:700;border-radius:5px;padding:0 6px;font-size:12px;margin-right:6px}
.sev.error{background:var(--orange);color:#fff}.sev.warn{background:var(--gold-t);color:var(--gold);border:1px solid #e5d49a}.sev.info{background:var(--slate-t);color:var(--slate)}
.issue{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;margin:7px 0;background:#fff}
.issue.error{border-left:4px solid var(--orange)}.issue.warn{border-left:4px solid var(--gold)}.issue.info{border-left:4px solid var(--slate)}.issue.acc{opacity:.65}
.issue .t{font-weight:600}.issue .d{font-size:13px;color:#39404f;margin-top:3px}
.bar{height:9px;background:var(--slate-t);border-radius:5px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue)}
.bar.p>i{background:var(--purple)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.tabs button{border-radius:16px}.tabs button.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.notice{background:var(--purple-t);border:1px solid #cdbfe0;border-radius:8px;padding:8px 12px;margin:10px 0;font-size:13.5px}
.notice.blue{background:var(--blue-t);border-color:#bfd2ea}.notice.gold{background:var(--gold-t);border-color:#e5d49a}
.follow{margin:6px 0 6px 14px;padding-left:12px;border-left:2px solid var(--rule)}
.warnline{background:var(--orange-t);border:1px solid #ecd0b0;border-radius:6px;padding:4px 9px;margin:5px 0;font-size:12.5px}
table.mat{border-collapse:collapse;font-size:12.5px}table.mat td,table.mat th{border:1px solid var(--rule);padding:0;text-align:center}
table.mat th{background:var(--slate-t);padding:3px 6px}
table.mat td button{width:34px;height:28px;border:none;border-radius:0;background:#fff;font-weight:700}
table.mat td.diag{background:#eceff4}
.rel-M{background:var(--blue)!important;color:#fff}.rel-S{background:var(--blue-t)!important;color:var(--blue)}.rel-X{background:var(--orange-t)!important;color:var(--orange)}
.stack{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;padding:6px 2px 12px}
.col{min-width:178px;background:#fff;border:1px solid var(--rule);border-radius:9px;padding:8px}
.col h5{margin:0 0 5px;font-size:13px}
.lvl{border:1px dashed var(--rule);border-radius:6px;padding:5px;margin:4px 0;min-height:50px;background:#fafbfd}.lvl.over{border-color:var(--orange);background:var(--orange-t)}.lvl.hot{outline:2px solid var(--purple)}
.lvl .lh{font-size:11.5px;color:var(--mut);display:flex;justify-content:space-between}
.chipbox{display:inline-block;border:1px solid var(--rule);border-radius:6px;padding:1px 6px;margin:2px 3px 2px 0;font-size:12px;cursor:grab;background:#fff;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top}
.chipbox.loud{border-color:var(--orange);background:var(--orange-t)}.chipbox.quiet{border-color:var(--blue);background:var(--blue-t)}.chipbox.pick{outline:2px solid var(--purple)}
svg text{font-family:inherit}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--slate);color:#fff;padding:8px 16px;border-radius:8px;z-index:50;font-size:13px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
#report{background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:26px 32px;max-width:960px}
#report h1{font-size:24px;color:var(--blue);margin:0 0 4px}#report h2{font-size:17px;margin:22px 0 6px;border-bottom:2px solid var(--blue);padding-bottom:3px;color:var(--blue)}
#report table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}#report td,#report th{border:1px solid var(--rule);padding:4px 6px;vertical-align:top;text-align:left}#report th{background:var(--blue-t)}
#report .sub{color:var(--mut)}#report .q{margin:2px 0;font-size:12.5px}
@media print{
  header.top,aside#coach,.noprint,nav.steps{display:none!important}
  html,body{background:#fff}.layout{display:block;padding:0}
  #report{border:none;padding:0;max-width:none}#report h2{break-after:avoid}#report table{break-inside:auto}#report tr{break-inside:avoid}
  .pb{break-before:page}
}

.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.opt{flex:1 1 230px;max-width:360px}.opt.compact{flex:0 0 auto;padding:3px 11px;border-radius:16px;max-width:none}
.opt{border:1px solid var(--rule);background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer}
.opt:hover{background:var(--slate-t)}.opt.dr{border-left:4px solid var(--purple)}
.opt.on{background:var(--blue-t);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.opt .ot{font-weight:600;font-size:13.5px}.opt .od{font-size:12.5px;margin-top:2px;color:#2f3646}.opt .ob{font-size:12px;margin-top:3px;color:var(--mut)}
.qbox{padding-bottom:4px;border-bottom:1px dotted var(--rule)}
.opt .op{font-size:11.5px;margin-top:3px;color:var(--purple)}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:8px 0}
.fstep{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;position:relative}
.fstep .fn{display:inline-block;width:26px;height:26px;border-radius:13px;background:var(--blue);color:#fff;text-align:center;line-height:26px;font-weight:700;margin-bottom:4px}
.story{background:#f3f7fd;border:1px solid #bfd2ea;border-left:4px solid var(--blue);border-radius:8px;padding:8px 12px;margin:6px 0 4px;font-size:13px}
.story p{margin:4px 0}.story .stt{font-weight:700;color:var(--blue);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
.story .drl{color:#4a3a6b}.lead{font-weight:600;font-size:13px;margin-top:8px;color:var(--ink)}
.tks{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px}.tk{font-size:13px;cursor:pointer;white-space:nowrap}
#report .sheet{border-top:3px solid var(--blue);margin-top:28px;padding-top:6px}
#report .sh{background:var(--blue);color:#fff;padding:10px 14px;border-radius:6px;margin:0 0 8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#report .shk{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.85}#report .sht{font-size:21px;font-weight:700}#report .shs{font-size:12.5px;opacity:.9}
#report .bs{background:#f3f7fd;border-left:4px solid var(--blue);padding:6px 10px;margin:6px 0;-webkit-print-color-adjust:exact;print-color-adjust:exact}#report .bst{font-weight:700;color:var(--blue);font-size:11px;text-transform:uppercase}
#report .idea{border:1px solid var(--rule);border-radius:6px;padding:6px 10px;margin:6px 0;break-inside:avoid}#report .fig{display:inline-block;margin:4px;width:230px;vertical-align:top}#report .fig img{width:230px;border:1px solid var(--rule)}
#report .fig figcaption{font-size:11px;color:var(--mut)}#report .ck{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--purple)}#report h4{color:var(--blue);margin:12px 0 4px}
@media print{#report .sheet{break-before:page;border-top:none;margin-top:0}#report th{background:#e6eef8!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.cov{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}.cv{font-size:11.5px;padding:1px 7px;border-radius:9px;border:1px solid var(--rule);background:#fff;color:var(--mut);cursor:pointer}
.cv.ok{background:var(--blue);color:#fff;border-color:var(--blue)}.cv.lead{border:2px solid var(--orange)}.cv.pr{cursor:default}.cv.pr.ok{background:var(--purple);border-color:var(--purple)}
.probe{font-size:13px;margin:5px 0}.pk{display:inline-block;font-size:11px;padding:0 7px;border-radius:8px;background:var(--slate-t);color:var(--slate)}.pk.need{background:var(--orange-t);color:var(--orange)}
.pk.pillar{background:var(--blue-t);color:var(--blue)}.pk.conflict{background:var(--gold-t);color:var(--gold)}.pk.evidence{background:var(--purple-t);color:var(--purple)}
.flash{outline:3px solid var(--orange);transition:outline .3s}
.tt{border-collapse:collapse;font-size:13px;width:100%}.tt td,.tt th{border:1px solid var(--rule);padding:5px 7px;vertical-align:top;text-align:left}.tt th{background:var(--blue-t)}
.syncb{font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--rule);white-space:nowrap;color:var(--mut);background:#fff}.syncb.ok{color:var(--blue);border-color:#bfd2ea;background:var(--blue-t)}.syncb.warn{color:var(--gold);background:var(--gold-t);border-color:#e5d49a}.syncb.bad{color:#fff;background:var(--orange);border-color:var(--orange)}
</style>

<script>
'use strict';
/* The master builder's questions. The designer tells the builder what to build, from the idea of the whole center
   down to the walls, floor, windows, and light of each room. Questions branch on earlier answers.
   q fields: id, elem (the part of the building), q (the question), kind (text | num | choice | chips | info | note), opts, req (the builder cannot build without it),
   why (why the builder asks), hint [[k, text]] (k = 'draft' for the Chapter 5 proposal, 'ev' for a finding of Chapters 1 to 4),
   types (space types it applies to), when(ctx, ans), other (adds a write-in), unit, max. Option fields: label, draft (the Chapter 5 proposal), follow, flag (a guard key), pil, types. */
const MOODS_ = DATA.mood;
const op = a => a.map(x => typeof x === 'string' ? { label: x } : x);
const Q = (id, elem, q, kind, o) => Object.assign({ id, elem, q, kind }, o || {});
const D_ = (label, o) => Object.assign({ label, draft: true }, o || {});
const F_ = (label, o) => Object.assign({ label }, o || {});
const ALL = null;

/* shared pieces ------------------------------------------------------------------ */
const COLOR_Q = Q('color', 'Color', 'What colors should it be? (base and accents)', 'chips', { req: true, max: 4, why: 'The builder orders paint, finishes, and tinted materials from this.', other: true, hint: [['ev', 'Survey: warm earth colors were chosen most (39%), then soft pastels and white or neutral with colorful art (31% each); cool blues and greens drew 11%.'], ['draft', 'Warm earth tones as the base, corn gold in the active zone, blues and greens as accents of planting and water only, no saturated red where teens rest.']],
  opts: op([D_('Warm earth tones'), F_('Soft pastels'), F_('White or neutral with colorful art'), D_('Corn gold accent'),
    F_('Cool blues and greens', { follow: [Q('cool_note', 'Color', 'The survey chose cool blues and greens least (11%); the draft keeps them to accents of planting and water, not wall color.', 'note')] }),
    F_('Saturated bright colors', { flag: 'red-quiet', follow: [Q('bright_where', 'Color', 'Where exactly would the bright colors go?', 'text')] }), F_('Ibanag red', { flag: 'red-quiet', pil: ['CP6'] }), F_('Dark and moody')]) });

const MATERIALS_Q = Q('materials', 'Materials', 'What are the main materials a person sees and touches here?', 'chips', { req: true, max: 6, other: true, why: 'The builder needs the material list to price, source, and detail the work.',
  hint: [['ev', 'Survey: bamboo and wood chosen most (42%), then brick or painted concrete (33%). Theory: timber houses were rated least safe after Haiyan; a bamboo soak test failed at 72 hours.'], ['draft', 'Concrete, steel, glass, timber, treated bamboo, and perforated aluminum in every phase; natural material shown with fine joinery.']],
  opts: op([
    F_('Fair-faced concrete', { follow: [Q('conc_finish', 'Materials', 'How is the concrete left?', 'choice', { opts: op(['Raw, unplastered', 'Sealed and polished', 'Tinted', 'Board-marked'].map(x => x)) })] }),
    D_('Timber', { pil: ['RP2'], follow: [Q('timber_where', 'Materials', 'Where is the timber used?', 'chips', { opts: op(['Rails and door pulls', 'Seats and benches', 'Ceiling', 'Floor', 'Wall lining', 'Furniture', 'Louvers']) }),
      Q('timber_note', 'Materials', 'Timber houses were rated least safe after Haiyan: keep it for touch surfaces and fine joinery, and show good joints so it does not read as cheap.', 'note')] }),
    D_('Treated bamboo', { pil: ['CP6', 'RP2'], follow: [Q('bamboo_use', 'Materials', 'What is the bamboo used for?', 'chips', { opts: op([D_('Linings'), D_('Screens and slats'), F_('Furniture'), F_('Structure', { flag: 'bamboo-structure' })]) }), Q('bamboo_dry', 'Materials', 'Kept dry? A 72-hour soak failed in the tests; bamboo stays under cover, treated with borate.', 'note')] }),
    D_('Woven panels', { pil: ['CP6', 'CP5'], follow: [Q('weave_by', 'Materials', 'Who makes them?', 'choice', { opts: op([D_('Valley weavers'), 'Local shops', 'Factory-made']) }), Q('weave_use', 'Materials', 'Used as', 'chips', { opts: op(['Acoustic panels', 'Screens', 'Wall hangings', 'Seat backs']) })] }),
    F_('Glass', { pil: ['RP1'], follow: [Q('glass_shade', 'Materials', 'How is the glass shaded?', 'chips', { req: true, opts: op([D_('Deep overhang'), D_('Fins'), D_('Timber or bamboo louvers'), D_('Perforated screen'), F_('None', { flag: 'glass-unshaded', excl: true })]) }),
      Q('glass_type', 'Materials', 'What kind of glass?', 'choice', { opts: op(['Clear', 'Tinted', 'Low-emissivity', 'Laminated safety glass', 'Frosted']) }), Q('glass_operable', 'Materials', 'How much of it opens?', 'choice', { opts: op([D_('A third or more'), 'Less than a third', 'Fixed']) })] }),
    D_('Perforated aluminum screens', { pil: ['CP6', 'CP5'], follow: [Q('screen_pattern', 'Materials', 'What pattern?', 'choice', { opts: op([D_('Corn kernel'), 'Weave', 'Other']) })] }),
    F_('Brick or painted concrete'), F_('Resilient floor'), D_('Polycarbonate or ETFE roof', { follow: [Q('roof_note', 'Materials', 'The draft keeps a patterned translucent roof over the commons only, since top light brings heat.', 'note')] }),
    D_('Green wall', { pil: ['RP1'], follow: [Q('green_water', 'Materials', 'What waters it?', 'choice', { req: true, opts: op([D_('Drip from a rain tank'), 'Mains supply', F_('None', { flag: 'greenwall-dry' })]) })] }),
    F_('Stone or river rock'), F_('Clay tile or terracotta'), F_('Rattan, cane, or rope'), F_('Fabric and shade sails'), F_('Cogon thatch', { flag: 'cogon' }), F_('Motorized or automated façade', { flag: 'auto-facade' })]) });

const CONTROL_Q = Q('control', 'Controls', 'Who controls the lights, fans, and windows?', 'choice', { why: 'The builder wires the controls where users can reach them.', hint: [['ev', 'Survey: a space felt like theirs when they control the lights, windows, and fans (54%).'], ['draft', 'Wall controls at a ten-year-old\'s reach; an app may duplicate them; sensors never override.']],
  opts: op([D_('Wall switches and louvers at a ten-year-old\'s reach', { pil: ['RP3'] }), D_('Wall switches and an app, the wall wins', { pil: ['RP3', 'RP6'] }), F_('Sensors only', { flag: 'control' }), F_('App only', { flag: 'control' }), 'Staff only']) });

const TECH_Q = Q('tech', 'Digital', 'Will digital elements be used here? Which?', 'chips', { req: true, other: true, why: 'The builder runs power, data, cooling, and security for each digital element.',
  hint: [['ev', 'Law: filtering and reporting in connected rooms (RA 11930). Survey: computers and games felt by 69%; a glass-walled esports room 54%, a VR room 50%.'], ['draft', 'Technology admitted on two conditions: a non-digital equal beside each digital room, and no device that takes control from the user.']],
  opts: op([F_('None here', { excl: true }), D_('Charging and data points', { pil: ['RP6'] }), F_('Screens or projection', { pil: ['RP6'], follow: [Q('twin', 'Digital', 'What is its non-digital equal beside it?', 'text', { req: true })] }),
    D_('VR or headsets', { pil: ['RP6'], follow: [Q('twin', 'Digital', 'What is its non-digital equal beside it?', 'text', { req: true }), Q('vr_age', 'Digital', 'Headsets are for older teens (parent-managed accounts for ages 10 to 12); what do the youngest use?', 'text')] }),
    D_('LED media wall', { pil: ['RP6'] }), F_('Gaming or esports computers', { pil: ['RP6'] }), F_('Recording or livestream equipment', { pil: ['RP6'] }), F_('3D printer or digital fabrication', { pil: ['RP6'] }), F_('Sensors or smart controls')]) });

/* ================================================================== THE WHOLE CENTER ================================================================== */
const SPEC_CENTER = [
  Q('concept_line', 'Concept', 'In one or two sentences, what is the Ilagan City Teen Center? What is its big idea?', 'text', { req: true, why: 'Every later choice is checked against this idea.', hint: [['draft', 'A campus of raised pavilions on one covered spine, set over a silong on flood-prone ground and organized from loud to quiet, carried by corn and the Mammangi as identity.'], ['ev', 'Survey: a landmark building led the form set (41%), and one main path with landmarks led (41%).']] }),
  Q('vibe', 'Concept', 'Which words describe the vibe of the whole center? (up to four)', 'chips', { req: true, max: 4, opts: op(MOODS_), why: 'The builder reads the vibe to choose between otherwise equal materials and details.', hint: [['ev', 'Theory: supportive environments are calm, controllable, and domestic in scale; Bahay Pag-asa read as a jail.']] }),
  Q('never', 'Concept', 'Which words must it never feel like? (up to three)', 'chips', { max: 3, opts: op(['Institutional', 'Custodial', 'Cold', 'Cramped', 'Gloomy', 'Sterile', 'Noisy', 'Exposed', 'Boring', 'Cheap']) }),
  Q('reference', 'Concept', 'Name a place, building, or thing that captures what you want, and what about it.', 'text'),
  Q('identity', 'Identity', 'Where does Ilagan show up in the center?', 'chips', { req: true, other: true, why: 'The builder needs to know which patterns, crafts, and stories to build in.', hint: [['ev', 'Survey: weave patterns 41%, corn and the Mammangi 40%. Site: Ilagan is the Corn Capital, fields on three sides; the Mammangi Festival; binakol, banderado, and nammata-mata weaving.'], ['draft', 'Corn and the Mammangi as the one fixed identity; the valley house as raised floor and silong; weaving and the butaka; a river story wall.']],
    opts: op([D_('Corn kernel pattern', { pil: ['CP6', 'CP5'] }), D_('The Mammangi festival', { pil: ['CP6'] }), D_('Weaving', { pil: ['CP6'] }), D_('Butaka-inspired seats', { pil: ['CP6'] }), D_('The river story', { pil: ['CP6'] }), D_('The valley house: raised floor and silong', { pil: ['CP6', 'CP3'] }), F_('Display water feature', { flag: 'display-water' })]) }),
  Q('identity_how', 'Identity', 'How is it shown? (it must be buildable: say where it goes)', 'chips', { when: (c, a) => (a.identity || []).length > 0, opts: op(['Pattern on screens and the roof', 'Carving and ornament on seats and rails', 'Murals and teen art', 'Names of places and zones', 'The festival use of the grounds', 'Planting (corn garden)', 'Woven panels']) }),
  Q('form', 'Massing', 'What is the overall shape of the center?', 'choice', { req: true, other: true, why: 'This fixes how many buildings the builder sets out, and how they are linked.', hint: [['ev', 'Site: the whole site may flood and the soil may liquefy; 240 m from road to fields. Survey: separate wings for loud and quiet led (42%).'], ['draft', 'A cluster of raised pavilions, three tall volumes, and a tower; one large multi-storey building was set aside so the ground stays free for floodwater.']],
    opts: op([D_('A campus of pavilions on one covered spine', { follow: [Q('link', 'Massing', 'How are the pavilions linked?', 'choice', { req: true, opts: op([D_('A covered spine at least 1.5 m clear'), 'Open paths under trees', 'Bridges and galleries']) })] }), F_('One large multi-storey building', { flag: 'one-building' }), F_('A courtyard building around a garden'), F_('Free-standing pavilions on open paths')]) }),
  Q('landmark', 'Massing', 'Is there a landmark that tells you the center is there from the road?', 'choice', { req: true, why: 'A tower, shell, or sign needs foundations and services planned early.', hint: [['ev', 'Site: the lots are seen from the road and Lullutan Bridge. Survey: a landmark building led (41%).'], ['draft', 'A slender tower at the forecourt with a lookout deck and raised rain tanks, plus the commons under the tallest shell.']],
    opts: op([D_('A slender tower', { follow: [Q('tower_h', 'Massing', 'How tall do you want the tower? (m)', 'num', { unit: 'm', req: true }), Q('tower_holds', 'Massing', 'What does the tower hold?', 'chips', { opts: op([D_('A lookout deck'), D_('Raised rain tanks'), F_('A climbing wall'), D_('Stair and lift'), 'Stored items']) }), Q('tower_skin', 'Massing', 'What is its skin?', 'choice', { opts: op([D_('Corn-kernel screen, lit at night'), 'Glass', 'Concrete', 'Timber or bamboo slats']) })] }), D_('A tall roof or shell'), F_('A gateway or sign only'), F_('No landmark')]) }),
  Q('flood', 'Ground and flood', 'How does the center deal with flood? (98% of the area was under water in 2020; the lots are 1.5 to 2 m below the road)', 'choice', { req: true, why: 'This sets the floor levels and the foundations the builder starts with.', hint: [['ev', 'Site: working flood level 1 m above lot grade; moderate liquefaction; Intensity VIII shaking. Law: floors about 1 m above the flood protection elevation.'], ['draft', 'Floors about 3.5 m above lot grade over an open silong of about 3 m; courts and gardens may flood; fill kept low because it loads liquefiable ground.']],

function answeredQs(scope, ans, ctx) { const out = []; specWalk(scope, ans, ctx, q => { if (q.kind !== 'note' && q.kind !== 'info' && (!isEmpty(ans[q.id]) || ans[q.id + '_other'])) out.push(q); }); return out; }

  const pc = principleCover(scope, ans, ctx);
  const want = scope === 'space' ? ['function', 'scale', 'space', 'light', 'climate', 'human', 'character'] : scope === 'vol' ? ['structure', 'climate', 'order', 'scale', 'character', 'circulation', 'sustain'] : scope === 'area' ? ['function', 'circulation', 'character'] : ['order', 'structure', 'climate', 'site', 'meaning', 'sustain', 'character'];
  want.filter(p => !pc.has(p)).slice(0, 2).forEach(p => add('Nothing yet on ' + PR_NAME[p].toLowerCase() + '. ' + ({ function: 'What happens here, for whom, and what does it need?', scale: 'How big and how high is it, and how does it feel to a ten-year-old?', space: 'Is it open or tucked, tall or low, one room or several?', light: 'Where does the light come from, by day and at night?', climate: 'How does it handle heat, rain, and breeze?', human: 'What touches the body: seats, rails, floors, controls?', character: 'What should it look like, and what makes it memorable?', structure: 'What holds it up, and is the structure shown?', order: 'What is its order: bays, module, repetition?', circulation: 'How do people arrive, move through, and leave?', sustain: 'How does it save water, energy, and upkeep?', site: 'How does it meet the ground, the flood, and its neighbors?', meaning: 'What makes it Ilagan\'s own?' }[p] || ''), null, 'principle'));

    h('div', { class: 'card' }, h('b', {}, S.counts.error + ' to fix'), h('div', { class: 'small mut' }, 'rest on law or on the site')),
    h('div', { class: 'card' }, h('b', {}, S.counts.warn + ' to check'), h('div', { class: 'small mut' }, 'rest on evidence or on the draft')),
    h('div', { class: 'card' }, h('b', {}, S.counts.accepted + ' accepted'), h('div', { class: 'small mut' }, 'with your reason'))));
  const pend = [];
  if (!st.done.criteria) pend.push('Mark "My criteria" complete so the coach can check coverage of the evidence.');
  if (!st.done.concept) pend.push('Mark "Concept and vibe" complete so the coach can tell what the builder still needs about the whole center.');
  if (!st.done.specify) pend.push('Mark "Specify the build" complete so the coach can tell which buildings and rooms cannot yet be built from what is written.');
  if (!st.done.program) pend.push('Mark the program complete so the coach can check what is missing from it.');
  if (pend.length) r.append(h('div', { class: 'notice gold' }, h('b', {}, 'Some checks wait for you. '), pend.join(' ')));
  const live = res.issues.filter(i => !i.accepted);
  ['error', 'warn', 'info'].forEach(sev => {
    const items = live.filter(i => i.sev === sev); if (!items.length) return;
    r.append(h('h3', {}, { error: 'To fix', warn: 'To check', info: 'Prompts' }[sev] + ' (' + items.length + ')'));
    items.forEach(i => r.append(issueCard(i)));
  });
  if (!live.length) r.append(h('div', { class: 'notice blue' }, 'Nothing is flagged right now. Read the record to make sure it says what you mean.'));
  const acc = res.issues.filter(i => i.accepted);
  if (acc.length) { r.append(h('h3', {}, 'Accepted with a reason (' + acc.length + ')')); acc.forEach(i => r.append(issueCard(i))); }
  // evidence coverage
  const cited = new Set(); st.crit.forEach(c => (c.ev || []).forEach(x => cited.add(x)));
  r.append(h('h3', {}, 'How much of the evidence your criteria use'));
  ['Survey', 'Site', 'Law', 'Theory', 'Precedent', 'Youth'].forEach(t => { const all = DATA.evidence.filter(e => e.tag === t), used = all.filter(e => cited.has(e.id)).length; r.append(h('div', { style: 'margin:4px 0;max-width:520px' }, h('div', { class: 'small' }, t + ': ' + used + ' of ' + all.length + ' findings cited'), h('div', { class: 'bar' }, h('i', { style: 'width:' + (all.length ? used / all.length * 100 : 0) + '%' })))); });
  r.append(h('div', { class: 'foot' }, btn('Back', () => go('look')), btn('To my record', () => go('record'), 'pri')));
  return r;
}
function issueCard(i) {
  const c = h('div', { class: 'issue ' + i.sev + (i.accepted ? ' acc' : '') });
  c.append(h('div', { class: 't' }, h('span', { class: 'sev ' + i.sev }, i.sev === 'error' ? '!' : i.sev === 'warn' ? '?' : 'i'), i.title), h('div', { class: 'small mut' }, 'Rests on: ' + i.basis + '   |   ' + i.cat), h('div', { class: 'd' }, i.detail));
  const row = h('div', { class: 'row', style: 'margin-top:5px' });
  (i.fix || []).forEach(f => row.append(btn(f.label || 'Fix', () => doFix(f), 'tiny pri')));
  if (i.accepted) row.append(h('span', { class: 'small' }, 'Reason: ' + i.reason + ' '), btn('Reopen', () => commit(() => { delete st.accepted[i.id]; }), 'tiny'));
  else { const inp = h('input', { type: 'text', placeholder: 'Accept this, because...', style: 'max-width:280px' }); row.append(inp, btn('Accept', () => { if (!inp.value.trim()) { toast('Write your reason first.'); return; } commit(() => { st.accepted[i.id] = inp.value.trim(); }); }, 'tiny')); }
  c.append(row); return c;
}
function doFix(f) {
  const A = f.arg;
  switch (f.act) {
    case 'goto': go(A); return;
    case 'adopt': commit(() => { st.dec[A] = Object.assign({}, st.dec[A], { d: (st.dec[A] && st.dec[A].d === 'adapt') ? 'adapt' : 'adopt' }); }); return;
    case 'phase1': commit(() => { const b = st.dec[A] || {}; st.dec[A] = Object.assign({}, b, { d: (b.d === 'defer' || b.d === 'adopt' || !b.d) ? 'adapt' : b.d, edit: Object.assign({}, b.edit, { phase: 1 }) }); }); return;
    case 'move': moveSpace(A[0], A[1], A[2]); return;
    case 'setFloors': commit(() => { st.floors[A[0]] = A[1]; }); return;
    case 'toggleDist': commit(() => { if (!st.dist.includes(A)) st.dist.push(A); }); return;
    case 'addCand': commit(() => addCandidate(A, null)); return;
    case 'setRel': commit(() => { if (A[1]) st.rel[A[0]] = A[1]; else delete st.rel[A[0]]; }); return;
    case 'dropRule': commit(() => { if (/^U/.test(A)) st.customRules.splice(+A.slice(1) - 1, 1); else st.ruleDec[A] = { d: 'drop' }; }); return;
    case 'removeAdded': commit(() => { st.added = st.added.filter(x => x.id !== A); }); return;
    case 'bringForward': commit(() => { const m = Math.min(...RES.eff.filter(s => s.vol === A).map(s => s.phase)); st.volPhase[A] = m; }); return;
  }
}

/* ------------------------------------------------------------------ 8 My record */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function saveFile() { const b = new Blob([JSON.stringify(st, null, 1)], { type: 'application/json' }); const a = h('a', { href: URL.createObjectURL(b), download: 'KAMANG_design_' + (st.designer || 'designer').replace(/[^a-z0-9]+/gi, '_') + '.json' }); document.body.append(a); a.click(); a.remove(); }
/* ------------------------------------------------------------------ boot */
render();

</script>
